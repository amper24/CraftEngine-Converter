craftengine_version: "26.8"
minecraft_version: "1.21.4"
item_material_fallback: paper
emit_item_material: false
emit_food_apple_material: false
generate_categories: true
generate_category_translations: true
organize_recipes: true
recipe_sort_mode: type_then_id
log_level: INFO
write_conversion_log: true
copy_all_assets: true
validate_resource_links: true
block_auto_state: solid
# Маппинг исходного типа рецепта -> целевая "станция".
# "crafting_table" = перенос в обычный верстак (shapeless_transform).
recipe_stations:
  farmersdelight:cooking: crafting_table
  farmersdelight:cutting: sliceboard
# Если True, неизвестные типы рецептов автоматически переносятся в верстак.
remap_unknown_stations: false
remap_unknown_station_target: crafting_table
# Добавлять предмет-контейнер (например, кастрюлю) как ингредиент при переносе.
# По умолчанию false: контейнер НЕ добавляется в рецепт.
include_container_ingredient: false
# Предмет, который добавляется как ингредиент для конкретного типа/namespace.
container_items:
  farmersdelight:cooking: farmersdelight:cooking_pot
  farmersdelight:cutting: farmersdelight:cutting_board

# --- SliceBoard (нарезка на доске) ---
sliceboard_enabled: true
sliceboard_custom_provider: craftengine
# Prefix resolver for non-vanilla IDs in SliceBoard: <prefix>:<item_path>.
# The GUI proposes values from recipe references and dependencies.
sliceboard_namespace_prefixes:
  farmersdelight: craftengine:farmersdelight
# Внешние namespace, которые удалить из ингредиентов рецептов.
# После исключения пустые рецепты полностью удаляются.
excluded_recipe_namespaces: []
interactive_namespace_mapping: true
strict_recipe_mode: false
# What to do when a recipe references a common/external tag that cannot be resolved
# from the source mod or a known dependency bridge: skip (default) or keep.
unresolved_recipe_tag_policy: skip
preserve_unsupported_recipes: true
generate_source_map: true
sliceboard_tool_keywords:
  - knife
  - cleaver
  - sword
  - scissors
  - blade
# ID кастомных блоков-досок CraftEngine (генерируется в sliceboard/config.yml).
sliceboard_block_ids:
  - farmersdelight:cutting_board

# --- Еда (базовые значения, меняй вручную) ---
food_enabled: true
food_nutrition: 4
food_saturation: 3.0
# Семантические carrier-materials. Материал выводится ТОЛЬКО для этих семейств.
drink_material: honey_bottle
soup_material: mushroom_stew
drink_keywords:
  - drink
  - juice
  - cider
  - tea
  - coffee
  - milk
  - water
  - syrup
  - nectar
  - smoothie
  - lemonade
  - soda
  - wine
  - mead
  - latte
  - cocoa
  - kombucha
  - tonic
soup_keywords:
  - soup
  - stew
  - chowder
  - broth
  - bisque
  - hotpot
food_keywords:
  - soup
  - salad
  - stew
  - sandwich
  - burger
  - wrap
  - pie
  - cake
  - brownie
  - noodle
  - pancake
  - cupcake
  - patty
  - pizza
  - skewer
  - bread
  - slaw
  - mushroom
  - juice
  - water
  - honey
  - chip
  - rice
  - pasta
  - mhadjeb
# --- Микро-нейросеть (определение типа предмета/блока) ---
# Классифицирует каждый объект, подсказывает представление в CraftEngine
# и генерирует команды проверки (reports/commands.txt, reports/semantics.md).
brain_enabled: true
brain_min_confidence: 0.6
brain_block_min_confidence: 0.7
brain_log_every_object: true
brain_categories: true
brain_food_detection: true

# --- Bytecode food extraction ---
bytecode_food_enabled: true
# If true, unmatched bytecode food fields are treated as conversion warnings/errors by future strict validation.
bytecode_food_strict: false
# --- Semantic reconstruction ---
bytecode_semantic_enabled: true
reconstruct_block_behaviors: true
reconstruct_item_components: true
reconstruct_loot_from_datagen: true
reconstruct_events_from_bytecode: true
conservative_phantom_filter: true
gear_enabled: true
gear_tool_keywords: [pickaxe, axe, shovel, hoe, shears, wrench]
gear_weapon_keywords: [sword, mace, dagger, hammer, club, rapier, katana, greatsword]
gear_spear_keywords: [spear, lance, javelin, halberd, glaive, pike]
gear_ranged_keywords: [bow, crossbow]
gear_shield_keywords: [shield, buckler]
armor_keywords: [helmet, chestplate, leggings, boots, armor, armour]

# --- GUI icon handling ---
# Keep one logical item when a source block/item has a dedicated 2D icon.
gui_icon_enabled: true
gui_icon_suffixes: ["_icon", "_inventory", "_gui"]
gui_icon_prefer_exact_item_texture: true

# --- Crop reconstruction ---
crop_reconstruction_enabled: true
crop_default_grow_speed: 0.5
crop_light_requirement: 9
crop_default_hardness: 0.0
crop_default_resistance: 0.0
crop_generate_loot_when_missing: true
crop_seed_relation_from_bytecode: true
crop_seed_name_suffixes: ["_seeds", "_seed"]

# --- Формат исходника ---
# auto      = определить самому (мод-JAR или пак ItemsAdder)
# mod       = всегда читать как мод (Forge / NeoForge / Fabric / Quilt)
# itemsadder= всегда читать как пак ItemsAdder (папка contents/)
source_mode: auto

# --- Импорт ItemsAdder -> CraftEngine ---
# resource.material в ItemsAdder семантичен (он задаёт ванильный предмет-основу:
# скорость удара, слот брони, поведение зелья), поэтому он сохраняется.
ia_preserve_material: true
# В CraftEngine нет флага "неуязвим к взрывам"; для блоков с no_explosion: true
# используется это сопротивление (уровень бедрока).
ia_explosion_immune_resistance: 3600000.0
# ItemsAdder назначает custom_model_data сам; CraftEngine тоже назначает id
# моделей сам, поэтому исходные значения только попадают в отчёт.
ia_force_custom_model_data: false
ia_generate_furniture: true
# Локаль, из которой берутся переводы display-name-* / lore-* ключей.
ia_default_locale: en
# Переносить consume_seconds / sound / animation из consumable.
ia_emit_consumable_details: true

# --- Режим «ресурс-пак -> CraftEngine» -------------------------------------
# Конвертер может взять обычный ресурспак и сгенерировать конфиги из найденных
# assets/<ns>/models/item/*.json и assets/<ns>/textures/item/*.png.

# В ресурспаке нет материала, поэтому каждому предмету нужен дефолтный.
# CraftEngine иначе молча подставит nether_brick.
rp_default_material: nether_brick

# assets/minecraft/ - это переопределение ванильных предметов, а не новый
# контент. По умолчанию такие ассеты копируются в пак, но предметы из них не
# создаются (фиксируется в reports/resourcepack.md).
rp_skip_vanilla_overrides: true
